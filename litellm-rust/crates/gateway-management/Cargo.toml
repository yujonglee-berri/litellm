[package]
name = "litellm-gateway-management"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "litellm_gateway_management"

[[bin]]
name = "litellm-gateway-management"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"], optional = true }
litellm-gateway-auth = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
default = []
store = [
    "dep:base64",
    "dep:chrono",
    "dep:litellm-gateway-auth",
    "dep:rand",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
]
server = ["store", "dep:axum", "dep:tokio"]

[dev-dependencies]
serde_json.workspace = true
tower = { version = "0.5.3", features = ["util"] }
