[package]
name = "litellm-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[[test]]
name = "workspace_crate_allowlist"
path = "tests/workspace_crate_allowlist.rs"

[dependencies]
base64.workspace = true
data-url = "0.3.2"
crc32fast = "1.5"
futures-util.workspace = true
litellm-auth.workspace = true
litellm-auth-azure.workspace = true
litellm-auth-aws = { workspace = true, optional = true }
rand.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1"
strum.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-tungstenite.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
url.workspace = true
aws-credential-types = { version = "1.3.0", features = ["hardcoded-credentials"], optional = true }

[features]
default = []
bedrock-auth = [
    "dep:aws-credential-types",
    "dep:litellm-auth-aws",
]
observability = ["dep:tracing-subscriber"]

[dev-dependencies]
futures-channel = "0.3"
rstest.workspace = true
tracing-subscriber.workspace = true
