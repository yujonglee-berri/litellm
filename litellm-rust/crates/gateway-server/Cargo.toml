[package]
name = "litellm-gateway-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "litellm_gateway_server"

[[bin]]
name = "litellm-gateway-server"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
axum.workspace = true
litellm-core.workspace = true
litellm-config.workspace = true
litellm-gateway-agent = { workspace = true, features = ["server"] }
litellm-gateway-inference = { workspace = true, features = ["server"] }
litellm-gateway-management = { workspace = true, features = ["server"] }
litellm-persist.workspace = true
litellm-gateway-otel = { workspace = true, optional = true }
litellm-gateway-router.workspace = true
litellm-operation-realtime.workspace = true
tokio = { workspace = true, optional = true }

[features]
default = []
server = ["dep:tokio"]
otel = ["dep:litellm-gateway-otel"]
python-config = ["litellm-config/python", "litellm-gateway-inference/python-config"]

[dev-dependencies]
tokio.workspace = true
tower = { version = "0.5.3", features = ["util"] }
