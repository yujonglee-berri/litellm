[workspace]
members = [
    "crates/auth",
    "crates/auth-azure",
    "crates/auth-aws",
    "crates/auth-google",
    "crates/auth-oauth",
    "crates/core",
    "crates/config",
    "crates/gateway-agent",
    "crates/gateway-inference",
    "crates/gateway-management",
    "crates/gateway-auth",
    "crates/gateway-router",
    "crates/python-interop",
    "crates/python-bridge",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/BerriAI/litellm"

[workspace.dependencies]
litellm-core = { path = "crates/core" }
litellm-auth = { path = "crates/auth" }
litellm-auth-azure = { path = "crates/auth-azure" }
litellm-auth-aws = { path = "crates/auth-aws" }
litellm-auth-google = { path = "crates/auth-google" }
litellm-auth-oauth = { path = "crates/auth-oauth" }
litellm-config = { path = "crates/config" }
litellm-gateway-agent = { path = "crates/gateway-agent", default-features = false }
litellm-gateway-inference = { path = "crates/gateway-inference", default-features = false }
litellm-gateway-management = { path = "crates/gateway-management", default-features = false }
litellm-gateway-auth = { path = "crates/gateway-auth", default-features = false }
litellm-gateway-router = { path = "crates/gateway-router" }
litellm-python-interop = { path = "crates/python-interop" }

tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
axum = "0.7"
pyo3 = "0.29.2"
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
pythonize = "0.29.0"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "http2", "stream"] }
rstest = "0.26.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
subtle = "2"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
azure_core = "1.0.0"
azure_identity = { version = "1.0.0", features = ["tokio"] }
moka = { version = "0.12.16", features = ["future"] }
strum = { version = "0.28.0", features = ["derive"] }
url = "2.5.8"
veil = "0.3.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = false
incremental = false
strip = "symbols"
